# CI — the first automated check this repository has had (TECH_DEBT PM-39).
#
# Three of the five steps below are commands that ALREADY EXIST and have only ever
# been run by hand. That is not a hypothetical gap: `npm run build` was broken by a
# type error and stayed broken, unnoticed, because nothing ran it (PM-24).
#
# Frontend and backend are separate jobs so a Python failure still reports the
# TypeScript result. One job with both would stop at the first error and hide half
# the picture on every red build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Added 2026-08-12 with the first `db`-marked tests. Postgres 16 to match
    # docker-compose: a suite that proves route enforcement against a different
    # major version is proving it somewhere nobody runs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 EXACTLY. The pinned dependencies have no wheels for 3.13/3.14,
          # which is the main reason the dev containers exist (README § Quick Start).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # No `ruff format --check` step. The backend has never been run through a
      # formatter, so adding one would make "reformat every file" a prerequisite for
      # the first green build. That is a decision for its own commit, not a side
      # effect of turning CI on. See the note at the end of backend/pyproject.toml.

      # The `db`-marked tests arrived on 2026-08-12 (`test_route_enforcement.py`),
      # so the postgres service this comment said to add "in the same change as
      # the first test that needs it" is in the job's `services` block above.
      #
      # They are what `DEPLOYMENT.md` § 0 blocker 2 asks for and the pure-logic
      # suite could not give: **RBAC enforcement across every route**, a login
      # round trip, and the migration chain. The first walks the application's
      # own route table rather than a hand-kept list, so a route added next week
      # is covered the moment it exists.
      - name: Migrate the test database
        env:
          DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
          SECRET_KEY: ci-only-key-with-enough-distinct-characters-8vRqM3
          APP_ENV: development
        run: alembic upgrade head

      # Added 2026-08-21. **CI migrated and then seeded nothing**, so every test
      # needing reference data either skipped or failed: the run was 912 passed /
      # 91 skipped where a seeded install is 1003 passed / 5 skipped. Five of those
      # skips were outright failures — three in `test_seed_credentials` (the
      # credential seeder exits when no providers exist), one AI-redaction test
      # that needs at least one user row, and one invitation test that needs the
      # Admin role to exist. So the suite had been red on main for days for purely
      # environmental reasons, which is the state in which nobody reads it.
      #
      # These are the three seeds `README.md` § Seeding calls required or strongly
      # recommended, in its order. All are idempotent. `seed_api_providers` carries
      # **labels and placeholders only** — no secrets — which is what makes it safe
      # in a public repository's CI.
      #
      # ROOT_PASSWORD is supplied because `seed_rbac` otherwise generates one and
      # prints it; the value below is deliberately an obvious non-credential on a
      # database that exists for ninety seconds. Same reasoning as SECRET_KEY above.
      - name: Seed reference data
        env:
          DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
          SECRET_KEY: ci-only-key-with-enough-distinct-characters-8vRqM3
          APP_ENV: development
          ROOT_PASSWORD: ci-only-throwaway-not-a-real-credential-Qh4Xm2
          ROOT_EMAIL: ci-root@example.com
        run: |
          python -m app.db.seed_rbac
          python -m app.db.seed_partner_tiers
          python -m app.db.seed_api_providers

      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
          SECRET_KEY: ci-only-key-with-enough-distinct-characters-8vRqM3
          APP_ENV: development
        run: pytest

      # The committed OpenAPI document is the source of the frontend's types (PM-42),
      # so a stale one means the frontend is typed against yesterday's API — which
      # passes every check while being wrong. No database needed: `app.openapi()`
      # builds the document from the route definitions.
      - name: Committed openapi.json must match the routes
        env:
          DATABASE_URL: postgresql+psycopg2://u:p@db:5432/x
          SECRET_KEY: ci-only-key-not-used-for-anything-at-all-here
        run: python -m app.tools.export_openapi --check

      # The check that would have caught what PM-37 was built for. A default that is
      # safe locally and unsafe in production is invisible until something asserts
      # it, and asserting it here means the assertion itself cannot rot.
      - name: Production config must refuse development defaults
        env:
          APP_ENV: production
          DATABASE_URL: postgresql+psycopg2://u:p@db:5432/x
          SECRET_KEY: this-is-a-development-placeholder-key-do-not-use
        run: |
          if python -c "import app.core.config" 2>/dev/null; then
            echo "::error::APP_ENV=production accepted an unsafe SECRET_KEY. PM-37's validator is not working."
            exit 1
          fi
          echo "Correctly refused."

  frontend:
    name: Frontend — typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Added 2026-08-21 (PM-50). The build needs a reachable API and previously had
    # none, so it failed every run on `TypeError: fetch failed` — which meant the
    # check PM-24 exists to restore was itself permanently broken.
    #
    # Two public routes enumerate their pages at build time, and `/sitemap.xml`
    # plus the `/for/*` pages fetch while prerendering. Wrapping each of those in a
    # survivable fallback was the cheaper fix and the wrong one: it would grow a
    # new exception every time a public page learned to read anything, and each one
    # weakens the guarantee that a page fails visibly when the backend is down.
    #
    # So the job gets a real backend instead. That also turns this step into a
    # genuine smoke test of the public surface — it now prerenders real partner and
    # category pages from real rows, which is strictly more than it ever checked.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The build reads the API, so this job runs one — which needs Python. 3.12
      # EXACTLY, for the same reason the backend job pins it: the dependencies have
      # no wheels for 3.13/3.14, and `ubuntu-latest`'s default has moved before.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # --legacy-peer-deps because package.json pins react 19 while next@14.2.35
      # declares peer react@^18.2.0, so plain `npm ci` FAILS OUTRIGHT. This mirrors
      # frontend/Dockerfile.dev. It is a documented workaround, not a fix — the fix
      # is the framework-version decision in TECH_DEBT PM-25, and this flag should
      # be deleted in the same change that settles it.
      - name: Install
        run: npm ci --legacy-peer-deps

      # Before the typecheck, because `types/api-contract.ts`'s assertions are only
      # meaningful against a freshly generated `api.d.ts`. Regenerate, then fail if the
      # committed file moved — a stale one would let the contract assertions pass
      # against an API that no longer exists, which is the single way this guard can lie.
      - name: Generated API types must be up to date
        run: npm run codegen:check

      # This is where a backend/frontend contract break surfaces:
      # `types/api-contract.ts` asserts the hand-written types still match the generated
      # ones, in both directions, and names the offending field when they do not.
      - name: Typecheck
        run: npm run typecheck

      # This step used to carry `continue-on-error: true` with an instruction to
      # delete it "when PM-25 is settled and PM-30's count is zero". PM-25 was
      # settled on 2026-08-11 and **the count reached zero on 2026-08-12**, so it
      # is gone: lint now blocks, which is the only state in which anyone reads it.
      #
      # The 19 were all `react-hooks` rules, and almost all one shape: a setState
      # run synchronously inside an effect body. Four remedies, in order of how
      # often they applied — hand the function to a callback rather than calling
      # it (`void Promise.resolve().then(load)`); derive the value instead of
      # storing it; `useHydrated()` for the three portals that only wanted to
      # know whether hydration had happened; and declaring a callback above the
      # effect that uses it.
      - name: Lint
        run: npm run lint

      # The public pages read the API while prerendering, so it has to be running.
      # Same three seeds as the backend job: `seed_directory` too, because a build
      # with no partners prerenders no partner pages and would quietly stop
      # checking the thing this step is here to check.
      - name: Start the API the build reads from
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
          SECRET_KEY: ci-only-key-with-enough-distinct-characters-8vRqM3
          APP_ENV: development
          ROOT_PASSWORD: ci-only-throwaway-not-a-real-credential-Qh4Xm2
          ROOT_EMAIL: ci-root@example.com
        run: |
          python -m pip install --quiet -r requirements.txt
          alembic upgrade head
          python -m app.db.seed_rbac
          python -m app.db.seed_partner_tiers
          python -m app.db.seed_directory
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8002 > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8002/api/v1/public/partners > /dev/null; then
              echo "API up after ${i} attempt(s)"; exit 0
            fi
            sleep 1
          done
          echo "::error::the API never came up; the build would fail on fetch"
          cat /tmp/api.log
          exit 1

      # The step that matters most, because this is the one that was silently
      # broken for an unknown length of time (PM-24). Type errors are fatal to
      # `next build` — next.config.mjs does not set typescript.ignoreBuildErrors.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8002
          # Server-side reads go through this (`lib/utils/constants.ts`), and
          # getting it wrong does not throw — it 404s and looks exactly like an
          # empty database, which `lib/api/public.ts` warns about at length.
          INTERNAL_API_URL: http://127.0.0.1:8002

      # If the build ever cannot reach the API again, the log says why.
      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log || true
