# Tool configuration only — this project is not packaged, so there is no
# [project] table and no build backend. Adding one would imply `pip install .`
# works, which it does not: the app is run from the source tree.

[tool.pytest.ini_options]
# `backend/` is the rootdir, matching every other backend command — both .env
# discovery and Alembic's script_location are relative to it (ONBOARDING § 0).
testpaths = ["tests"]
pythonpath = ["."]
# Show the reason for every skip. A silently skipped test is worse than a missing
# one: the count goes up and nothing was verified.
addopts = "-ra --strict-markers --strict-config"
markers = [
    "db: needs a live PostgreSQL connection (deselect with '-m \"not db\"')",
]

[tool.ruff]
# The code is written to ~100 columns; measured, the longest line in app/ is 118
# and only eight exceed 100. 120 is the enforced ceiling rather than 100 so the
# linter flags a genuinely runaway line without requiring a reformatting commit
# across six unrelated files as the price of turning linting on at all.
line-length = 120
target-version = "py312"

# extend-exclude, NOT exclude. Plain `exclude` REPLACES ruff's built-in list, which
# is how the first version of this file came to lint `backend/.venv` — the dead
# virtualenv from PM-23 — and report 32,488 errors across 1,256 files.
extend-exclude = [
    # The whole migrations tree, not just versions/.
    #
    # `versions/` is generated by Alembic from a template and edited only in the
    # middle, so holding it to the app's style means fighting the generator on every
    # migration.
    #
    # `env.py` is excluded for a stronger reason: it is a PROTECTED file
    # (documentation/AGENTS.md § Protected Files) and its import block carries a
    # load-bearing comment — "EVERY model must be imported here or --autogenerate
    # cannot see it, and may emit a migration that DROPS ITS TABLE". Running I001
    # over it hoisted an import above that comment, detaching the warning from the
    # list it governs. Measured, not hypothetical: it happened while this config was
    # being written. A linter must not be able to quietly rearrange that file.
    "app/db/migrations",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
]
ignore = [
    # `datetime.UTC` instead of `timezone.utc`. Correct for new code, but the
    # codebase uses `timezone.utc` in 40-odd places and a partial migration is
    # worse than either convention applied consistently. Revisit as one change.
    "UP017",
    # zip() without strict=. There are no unequal-length zips here, and the
    # rule would fire on every existing call site.
    "B905",
    # `Depends(...)` / `Cookie(...)` in a default argument. 140 of the 158 findings
    # on first run were this, and every one is FastAPI's documented idiom — it is
    # how a dependency is declared. Not a per-file ignore because it applies to
    # routers, guards and schemas alike.
    "B008",
    # `raise X from err` inside an except block. The rule is sound in general and
    # wrong here: all 7 sites raise a PRE-BUILT exception object, and two of them
    # (`_CREDENTIALS_EXC`, `_SESSION_EXC` in core/dependencies.py) are module-level
    # singletons shared across every request. `from err` sets `__cause__` on the
    # shared instance, so one request would be attaching its cause to an object
    # another request is raising. Chaining would have to come with rebuilding those
    # exceptions per call, which is a deliberate design change, not a lint fix.
    "B904",
    # try/except/pass → contextlib.suppress. One site: the nested `db.rollback()`
    # guard in activity_service, where the outer handler has already logged and
    # nothing further can be done. It carries an explanatory `# noqa: BLE001`
    # already; `suppress` would read as "this is fine" rather than "this is the
    # second failure in a row and there is nowhere left to report it".
    "SIM105",
]

[tool.ruff.lint.isort]
# Keep `from app.api import (roles, settings as settings_api, users)` as ONE
# statement. Ruff's default (false) breaks every aliased name onto its own `from`
# line, which in `main.py` splits the router imports into two blocks that read as
# unrelated. One block, alphabetically sorted, is what the file already looked like.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# conftest.py sets os.environ BEFORE importing app modules, deliberately and with
# the reason in its docstring: app.core.config builds Settings() at module scope,
# so the environment must exist first. E402 is exactly that pattern.
"tests/conftest.py" = ["E402"]

# Deliberately NOT configured: `ruff format`. The backend has never been run
# through a formatter, so enabling one would produce a reformat of every file as a
# prerequisite for the first lint run. That is the owner's call to make as its own
# commit, not a side effect of adding CI. `ruff check` catches the defects;
# formatting is a preference.
